pemahaman: >
  Keputusan 1: Memilih displot(kind='hist', col='Kelas')
  untuk membuat histogram terpisah berdasarkan kelas karena
  membutuhkan antarmuka figure-level dan perbandingan distribusi.
  Keputusan 2: Memilih kdeplot dengan hue='kelas' untuk
  membandingkan bentuk distribusi durasi secara halus.
  Bandwidth 0.5 dipilih untuk mempertahankan detail kurva,
  dengan pemahaman bahwa bandwidth perlu dievaluasi agar tidak
  menonjolkan variasi acak. Bandwidth 1.5 akan menghasilkan
  penghalusan lebih besar, tetapi dampaknya bergantung pada data.
keputusan: validated
