# ============================================================================
# state.yaml : SUMBER KEBENARAN PROGRES (Learn A.I Workflow for Data Science)
# ============================================================================
# Aturan:
#  - File ini hanya diubah lewat tools/progress.py (atau oleh Rafa secara sadar).
#  - Mentor AI TIDAK PERNAH mengubah file ini. Mentor hanya mengusulkan
#    Evidence Entry (lihat system/03_rubrik_validasi.md bagian 8).
#  - Jika ingatan mentor berbeda dengan file ini, yang berlaku adalah file ini.
#  - Urutan modul dalam daftar = urutan roadmap (system/02_roadmap.md).
#
# Nilai status yang sah:
#   belum             : belum dimulai (terkunci bila bukan quest aktif)
#   aktif             : quest yang sedang dikerjakan (hanya boleh satu)
#   learned           : materi dipelajari, belum lulus ujian
#   validated         : lulus ujian validasi, bukti lengkap
#   validated_legacy  : dinyatakan selesai sebelum rubrik ada, bukti belum lengkap
#   retained          : lulus retrieval review setelah jeda >= 7 hari
#   mastered          : terbukti dipakai mandiri di >= 2 konteks
#
# Modul yang punya daftar `quest` tidak menyimpan status sendiri; statusnya
# diturunkan dari quest-nya. Tipe modul: materi (default) | review | portfolio |
# capstone. Modul `opsional: true` tidak dihitung untuk membuka Portfolio.
# Portfolio dalam sebuah World terbuka bila semua modul non-opsional dan non-
# portfolio di World itu sudah selesai (>= validated_legacy).
#
# Bidang opsional per modul: tanggal_validasi, evidence (daftar id di
# state/evidence/), review_berikutnya (YYYY-MM-DD), perlu_review (true/false),
# catatan.
# ============================================================================

